{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "jupyterhub-usage-quotas.usage-viewer.serviceaccount.fullname" . }}
  labels:
    {{- include "jupyterhub-usage-quotas.labels" . | nindent 4 }}
    app.kubernetes.io/component: usage-viewer
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
{{- end }}
