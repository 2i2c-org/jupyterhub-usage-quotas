{{- $fullname := include "jupyterhub-usage-quotas.usage-viewer.fullname" . }}
{{- /*
    Keep the generated session secret key on upgrade, so that the users stay
    logged in. An explicitly set sessionSecretKey always takes precedence.
*/}}
{{- $sessionSecretKey := .Values.sessionSecretKey }}
{{- if not $sessionSecretKey }}
    {{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname | default (dict "data" (dict)) }}
    {{- if hasKey $existing.data "session-secret-key" }}
        {{- $sessionSecretKey = index $existing.data "session-secret-key" | b64dec }}
    {{- else }}
        {{- $sessionSecretKey = randAlphaNum 64 }}
    {{- end }}
{{- end }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "jupyterhub-usage-quotas.labels" . | nindent 4 }}
    app.kubernetes.io/component: usage-viewer
type: Opaque
data:
  values.json: {{ dict "UsageViewer" (.Values.config.UsageViewer | default dict) | toJson | b64enc | quote }}
  session-secret-key: {{ $sessionSecretKey | b64enc | quote }}
  {{- with .Values.jupyterhub.apiToken.value }}
  api-token: {{ . | b64enc | quote }}
  {{- end }}
