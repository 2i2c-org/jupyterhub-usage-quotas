# General configuration
# -----------------------------------------------------------------------------
#
nameOverride:
fullnameOverride: ""
global: {}

# UsageViewer configuration
# -----------------------------------------------------------------------------
#
config:
  UsageViewer: {}
    # public_hub_url: https://hub.example.org/  # Required.
    # service_name: usage-quota
    # hub_api_url:

# The API token for Hub API requests, if config.UsageViewer.hub_api_token is
# not set.
hubApiToken:
  existingSecret:
    # The z2jh hub Secret.
    name: hub
    # If empty, defaults to hub.services.<service_name>.apiToken.
    key: ""

# If empty, a random key is generated on install and kept on upgrade.
sessionSecretKey: ""

# Deployment resource
# -----------------------------------------------------------------------------
#
replicas: 1
image:
  repository: ghcr.io/2i2c-org/jupyterhub-usage-quotas
  tag: set-by-chartpress
  pullPolicy: ""
  pullSecrets: []
extraEnv: []
extraVolumes: []
extraVolumeMounts: []
resources: {}
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534 # nobody user
  runAsGroup: 65534 # nobody group
podSecurityContext: {}
podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []

# ServiceAccount resource
# -----------------------------------------------------------------------------
#
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Service resource
# -----------------------------------------------------------------------------
#
service:
  type: ClusterIP
  port: 9000
  annotations: {}

# NetworkPolicy resource
# -----------------------------------------------------------------------------
#
networkPolicy:
  enabled: true
  ingress: []
