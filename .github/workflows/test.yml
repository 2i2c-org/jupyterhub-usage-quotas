name: Test Suite

on:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hatch
        uses: pypa/hatch@install

      - name: Run linters
        run: hatch run style:check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up fake k8s cluster
      uses: jupyterhub/action-k3s-helm@v4
      with:
        k3s-version: v1.34.1+k3s1
        metrics-enabled: false
        traefik-enabled: false
        docker-enabled: false

    - name: Install hatch
      uses: pypa/hatch@install

    - name: Check installation
      run: hatch run install:check

    - name: Check dependencies
      run: hatch run audit:check

    - name: Test suite
      run: hatch run +py=${{ matrix.python-version }} test:run

    # - name: Upload coverage reports to Codecov
    #   uses: codecov/codecov-action@v5
    #   with:
    #     token: ${{ secrets.CODECOV_TOKEN }}

    - name: Check types
      run: hatch run types:check

  chart:
    runs-on: ubuntu-latest
    env:
      CHART: helm/jupyterhub-usage-quotas
      LINT_VALUES: tests/helm/lint-and-validate-values.yaml

    steps:
      - uses: actions/checkout@v7

      - name: Generate values.schema.json
        run: yq -o json $CHART/values.schema.yaml > $CHART/values.schema.json

      - name: Helm lint (values.yaml)
        run: helm lint --strict $CHART

      - name: Helm lint (lint-and-validate-values.yaml)
        run: helm lint --strict $CHART --values $LINT_VALUES

      # Renders the default values and lint-and-validate-values.yaml, and
      # checks the names, selectors, ports, URLs, secrets and config.
      - name: Check rendered manifests
        run: tests/helm/test-rendered-manifests.sh
