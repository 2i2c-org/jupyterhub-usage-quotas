# This is the configuration for chartpress, a CLI for Helm chart management.
#
# chartpress is used to:
# - Build images
# - Update Chart.yaml (version) and values.yaml (image tags)
# - Package and publish Helm charts to an OCI registry
#
# For more information, see the projects README.md file:
# https://github.com/jupyterhub/chartpress
#
charts:
  - name: jupyterhub-usage-quotas
    chartPath: helm/jupyterhub-usage-quotas
    imagePrefix: ghcr.io/2i2c-org/
    # Set dev version by taking latest tag and incrementing patch
    baseVersion: patch
    repo:
      # The chart is published to
      # oci://ghcr.io/2i2c-org/jupyterhub-usage-quotas/jupyterhub-usage-quotas
      oci: ghcr.io/2i2c-org/jupyterhub-usage-quotas
    images:
      jupyterhub-usage-quotas:
        valuesPath: image
        contextPath: .
        dockerfilePath: Dockerfile
